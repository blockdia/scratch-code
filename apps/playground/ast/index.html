<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AST Playground</title>
  </head>
  <body>
    <main class="package-shell">
      <a class="back-link" href="../">← All playgrounds</a>
      <p class="eyebrow">@scratch-code/ast</p>
      <h1>AST Playground</h1>
      <p class="lede">
        Validate an untrusted semantic script collection, then traverse its nodes with
        <code>walk()</code>.
      </p>
      <div class="toolbar">
        <button class="button button-primary" id="analyze" type="button">
          Validate &amp; analyze</button
        ><button class="button" id="reset" type="button">Reset example</button>
      </div>
      <div class="grid">
        <section class="panel">
          <h2>Script[] JSON</h2>
          <label for="source" class="eyebrow">Semantic AST</label
          ><textarea id="source" spellcheck="false"></textarea>
          <p class="error" id="error" role="alert"></p>
        </section>
        <section class="panel">
          <h2>Validation and traversal result</h2>
          <pre id="output"></pre>
        </section>
      </div>
    </main>
    <script type="module" src="/src/ast-playground.ts"></script>
  </body>
</html>
