<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>TurboWarp Blocks Playground</title>
  </head>
  <body>
    <main class="package-shell">
      <a class="back-link" href="../">← All playgrounds</a>
      <p class="eyebrow">@scratch-code/turbowarp-blocks</p>
      <h1>TurboWarp Blocks Playground</h1>
      <p class="lede">Search the generated catalog by opcode, shape, input, or field name.</p>
      <div class="toolbar">
        <input
          id="search"
          type="search"
          aria-label="Search block specifications"
          placeholder="Search opcodes, inputs, and fields…"
        /><span class="summary" id="summary"></span>
      </div>
      <div class="catalog">
        <div class="spec-list" id="list" aria-label="Matching block specifications"></div>
        <section class="panel">
          <h2>Selected specification</h2>
          <pre id="output"></pre>
        </section>
      </div>
    </main>
    <script type="module" src="/src/turbowarp-blocks-playground.ts"></script>
  </body>
</html>
